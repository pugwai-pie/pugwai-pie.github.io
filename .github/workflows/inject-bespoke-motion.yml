name: Inject bespoke motion layer
on:
  push:
    branches: [semantic-card-animations]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-card-animations
          fetch-depth: 0
      - name: Inject motion scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tags=[
              '<script src="assets/bespoke-motion.js"></script>',
              '<script src="assets/always-motion.js"></script>'
          ]
          changed=False
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
                  changed=True
          if changed:
              p.write_text(s)
          PY
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load continuous motion system"
          git push origin HEAD:semantic-card-animations
